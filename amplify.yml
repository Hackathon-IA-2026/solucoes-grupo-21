version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@10
        - pnpm install --frozen-lockfile=false
        - env | grep -E '^VITE_' >> artifacts/rio-flex/.env || true
    build:
      commands:
        - pnpm --filter @workspace/rio-flex run build
  artifacts:
    baseDirectory: artifacts/rio-flex/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - $(pnpm store path)
